# vmbuilder configuration

# Default VM resources
DEFAULT_RAM=2048
DEFAULT_VCPUS=2

# Root credentials
ROOT_PASSWORD="Test1234!"

# Networks
MGMT_NET="default"
LAB_NET="lab-net"
LAB_NET_BRIDGE="virbr-lab"
LAB_NET_IP="10.10.10.1"
LAB_NET_NETMASK="255.255.255.0"
LAB_NET_DHCP_START="10.10.10.10"
LAB_NET_DHCP_END="10.10.10.200"

# Storage paths (leave empty to use defaults: original/ and vms/ next to the script)
ORIGINAL_DIR=""
VMS_DIR=""

# Folder scanned for raw qcow2 source images during 'build' (leave empty to always prompt)
SOURCES_DIR=""

# Folder scanned for ISOs during 'ks-test' (leave empty to always prompt)
KS_ISO_DIR=""

# Default kickstart file path for 'ks-test' (leave empty to always prompt)
KS_PATH=""

# Default disk size (GB) for VMs created with ks-test
KS_DISK_SIZE=20
