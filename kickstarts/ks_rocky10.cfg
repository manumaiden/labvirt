# Rocky Linux 10 — minimal server, no GUI
text
skipx
reboot

lang en_US.UTF-8
keyboard --xlayouts=us
timezone Europe/Prague --utc

network --bootproto=dhcp --device=link --activate --onboot=yes

rootpw --plaintext Test1234!
user --name=testuser --password=Test1234! --plaintext --groups=wheel

selinux --enforcing
firewall --enabled --service=ssh
services --enabled=sshd

clearpart --all --initlabel
autopart --type=lvm

%packages --ignoremissing
@core
vim-enhanced
bash-completion
net-tools
tcpdump
bind-utils
%end

%post --erroronfail
mkdir -p /etc/ssh/sshd_config.d
echo "PermitRootLogin yes" > /etc/ssh/sshd_config.d/01-permitroot.conf
%end
